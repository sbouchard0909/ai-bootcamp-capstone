name: Create Step Issues

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Specific step to create (e.g., 01, 02, or "all" for all steps)'
        required: false
        default: 'all'

jobs:
  create-issues:
    name: Create GitHub Issues from Steps
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create issues from step files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          #!/bin/bash
          set -e
          
          STEP_INPUT="${{ github.event.inputs.step }}"
          STEPS_DIR=".github/steps"
          
          # Function to create issue from step file
          create_issue() {
            local file=$1
            local filename=$(basename "$file")
            
            # Skip README
            if [[ "$filename" == "README.md" ]]; then
              return
            fi
            
            # Extract step number from filename (e.g., step-01-project-setup.md -> 01)
            local step_num=$(echo "$filename" | sed -n 's/step-\([0-9]*\)-.*/\1/p')
            
            # Check if we should process this step
            if [[ "$STEP_INPUT" != "all" && "$STEP_INPUT" != "$step_num" ]]; then
              return
            fi
            
            # Extract title (first H1)
            local title=$(grep -m 1 "^# " "$file" | sed 's/^# //')
            
            # Read full content for body
            local body=$(cat "$file")
            
            # Determine labels based on content
            local labels="step"
            if grep -q "Backend" "$file"; then
              labels="$labels,backend"
            fi
            if grep -q "Frontend" "$file"; then
              labels="$labels,frontend"
            fi
            if grep -q "Testing" "$file"; then
              labels="$labels,testing"
            fi
            
            # Add step number to title
            local issue_title="Step $step_num: $title"
            issue_title="${issue_title#Step : }"  # Clean up if title already has "Step X:"
            
            echo "Creating issue: $issue_title"
            
            # Check if issue already exists
            existing_issue=$(gh issue list --label "step" --search "in:title \"$issue_title\"" --json number --jq '.[0].number')
            
            if [[ -n "$existing_issue" ]]; then
              echo "  ⚠️  Issue already exists: #$existing_issue"
              echo "  Updating issue body..."
              echo "$body" | gh issue edit "$existing_issue" --body-file -
            else
              # Create the issue
              echo "$body" | gh issue create \
                --title "$issue_title" \
                --body-file - \
                --label "$labels"
              echo "  ✅ Issue created successfully"
            fi
            
            echo ""
          }
          
          # Process step files
          if [[ "$STEP_INPUT" == "all" ]]; then
            echo "Creating issues for all steps..."
            for file in "$STEPS_DIR"/step-*.md; do
              if [[ -f "$file" ]]; then
                create_issue "$file"
              fi
            done
          else
            # Process specific step
            echo "Creating issue for step $STEP_INPUT..."
            file="$STEPS_DIR/step-$STEP_INPUT-"*.md
            if [[ -f $file ]]; then
              create_issue "$file"
            else
              echo "❌ Step file not found: $file"
              exit 1
            fi
          fi
          
          echo "✨ Done!"
